services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fin_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Bangkok
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6335:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7476:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/var/lib/neo4j/conf
      - neo4j_plugins:/plugins

  # Backend FastAPI service
  backend:
    build: .
    container_name: chatbot_backend
    restart: unless-stopped
    ports:
      - "19101:8000" # Map port 19101 to container port 8000
    depends_on:
      - postgres
      - neo4j
      - qdrant
    env_file:
      - .env
    volumes:
      - ./upload_file:/app/upload_file
      - ./uploaded_files:/app/uploaded_files
      - ./json_output:/app/json_output
      - ./json_text:/app/json_text
      - /home/aigentic/.cache/huggingface/hub/models--BAAI--bge-m3:/root/.cache/huggingface/hub/models--BAAI--bge-m3
      - /home/aigentic/.cache/huggingface/hub/models--BAAI--bge-reranker-base:/root/.cache/huggingface/hub/models--BAAI--bge-reranker-base

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
  neo4j_plugins:
