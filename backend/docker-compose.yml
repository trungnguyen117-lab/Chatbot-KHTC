services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fin_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Bangkok
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.2.1
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"        # REST API
      - "6334:6334"        # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__PATH: /qdrant/storage
      COLLECTIONS_NAME: NEW-28
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "
        apt-get update && apt-get install -y curl &&
        /qdrant/qdrant &
        sleep 5 &&
        curl -X PUT 'http://localhost:6333/collections/NEW-28' -H 'Content-Type: application/json' -d '{
          \"vectors\": {
            \"size\": 1536,
            \"distance\": \"Cosine\"
          }
        }'
      "

volumes:
  pg_data:
  qdrant_data:
