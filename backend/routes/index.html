<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>KHTC-UET - Quản lý tài liệu</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      font-family: 'Segoe UI', sans-serif;
      padding: 40px;
    }
    .container {
      max-width: 800px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    #roleInfo {
      font-weight: bold;
      margin-top: 15px;
    }
    .btn-primary, .btn-success {
      border-radius: 30px;
    }
    table {
      margin-top: 20px;
    }
    thead {
      background-color: #2980b9;
      color: white;
    }
    tbody tr:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h2>🏢 KHTC-UET - Quản lý Tài liệu</h2>
    <button class="btn btn-primary" onclick="loginWithGoogle()">Google Login</button>
    <p id="roleInfo"></p>

    <div id="uploadSection" style="display:none;">
      <h4 class="mt-4">Upload File (Admin only)</h4>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx" class="form-control mt-2" />
      <button class="btn btn-success mt-2" onclick="uploadFile()">Upload</button>
      <p id="uploadResult" class="text-danger"></p>
    </div>

    <button class="btn btn-outline-secondary mt-4" id="getBtn" onclick="getFiles()" style="display:none;">Xem danh sách File 📂</button>

    <table class="table table-striped" id="fileTable" style="display:none;">
      <thead>
        <tr>
          <th>Tên File</th>
          <th>Đường dẫn</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody id="fileTableBody"></tbody>
    </table>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDwhqypZ4fU6wJCRwTN3JnclJlcQS1xGas",
      authDomain: "sso-project-dce86.firebaseapp.com",
      projectId: "sso-project-dce86",
    };
    firebase.initializeApp(firebaseConfig);

    function renderUI(role) {
      const roleInfo = document.getElementById("roleInfo");
      roleInfo.innerText = role === "admin"
        ? "🔑 Vai trò: Admin"
        : "👤 Vai trò: User";
      document.getElementById("uploadSection").style.display = role === "admin" ? "block" : "none";
      document.getElementById("getBtn").style.display = "inline-block";
    }

    let isLoggingIn = false;
    async function loginWithGoogle() {
      const loginButton = document.querySelector('.btn-primary');
      
      // Kiểm tra xem có đang trong quá trình đăng nhập không
      if (isLoggingIn) {
        console.log("Đang trong quá trình đăng nhập, vui lòng đợi...");
        return;
      }
      
      try {
        isLoggingIn = true; // Đánh dấu đang trong quá trình đăng nhập
        loginButton.disabled = true; // Vô hiệu hóa nút đăng nhập
        loginButton.textContent = 'Đang đăng nhập...';
        
        console.log("Bắt đầu đăng nhập với Google...");
        
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.setCustomParameters({
          prompt: 'select_account'
        });
        
        const result = await firebase.auth().signInWithPopup(provider);
        if (!result || !result.user) {
          throw new Error("Không nhận được thông tin người dùng từ Google");
        }
        const user = result.user;
        console.log("Đăng nhập Google thành công, đang lấy token...");
        
        const token = await user.getIdToken(true);
        console.log("Đã lấy được token:", token.substring(0, 20) + "...");
        localStorage.setItem("firebase_token", token);
        
        console.log("Đang gọi API whoami...");
        const res = await fetch("http://127.0.0.1:8000/whoami", {
          method: "GET",
          headers: { 
            "Authorization": `Bearer ${token}`
          },
          mode: 'cors'
        });
        
        console.log("Kết quả API:", res.status, res.statusText);
        const data = await res.json();
        console.log("Dữ liệu trả về:", data);
        
        if (!res.ok) {
          throw new Error(JSON.stringify(data));
        }
        renderUI(data.role);
      } catch (e) {
        console.error("Chi tiết lỗi:", e);
        alert("Lỗi đăng nhập: " + e.message);
      } finally {
        // Luôn reset trạng thái và nút sau khi hoàn thành
        isLoggingIn = false;
        loginButton.disabled = false;
        loginButton.textContent = 'Google Login';
      }
    }

    async function downloadFile(filePath, filename) {
      try {
        const token = localStorage.getItem("firebase_token");
        if (!token) {
          throw new Error("Vui lòng đăng nhập lại");
        }
        const res = await fetch(`http://127.0.0.1:8000/download${filePath}`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        if (!res.ok) {
          throw new Error("Không thể tải file");
        }
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();
      } catch (error) {
        console.error("Lỗi tải file:", error);
        alert(error.message);
      }
    }

    async function uploadFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Chọn file trước.");
      
      try {
        const token = localStorage.getItem("firebase_token");
        if (!token) {
          throw new Error("Vui lòng đăng nhập lại");
        }

        const formData = new FormData();
        formData.append("file", file);

        let res = await fetch("http://127.0.0.1:8000/upload/", {
          method: "POST",
          headers: { 
            "Authorization": `Bearer ${token}`
          },
          body: formData
        });

        // Nếu server trả về conflict (409) -> hỏi lại user
        if (res.status === 409) {
          const choice = confirm("⚠️ File đã tồn tại.\nChọn OK để Replace, Cancel để lưu thành bản mới (_1, _2, _3).");
          
          if (choice) {
            // Replace
            res = await fetch("http://127.0.0.1:8000/upload/?replace=true", {
              method: "POST",
              headers: { "Authorization": `Bearer ${token}` },
              body: formData
            });
          } else {
            // Append (_1, _2, _3)
            res = await fetch("http://127.0.0.1:8000/upload/?append=true", {
              method: "POST",
              headers: { "Authorization": `Bearer ${token}` },
              body: formData
            });
          }
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Lỗi upload file");
        }

        document.getElementById("uploadResult").innerText = "✔️ Upload thành công!";
        document.getElementById("fileInput").value = ""; // Reset file input
        getFiles(); // Refresh danh sách file

      } catch (error) {
        console.error("Lỗi upload:", error);
        document.getElementById("uploadResult").innerText = "❌ " + error.message;
      }
    }

    async function getFiles() {
      const token = localStorage.getItem("firebase_token");
      if (!token) return alert("Chưa login");
      const res = await fetch("http://127.0.0.1:8000/files/", {
        method: "GET",
        headers: { 
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        }
      });
      const data = await res.json();
      if (!res.ok) return alert("Lỗi: " + JSON.stringify(data));
      const table = document.getElementById("fileTable");
      const tbody = document.getElementById("fileTableBody");
      tbody.innerHTML = "";
      data.forEach((file) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>
            <a href="#" onclick="downloadFile('${file.file_path}', '${file.filename}')" style="text-decoration: none;">
              📄 ${file.filename}
            </a>
          </td>
          <td>${file.file_path}</td>
          <td>${new Date(file.uploaded_at).toLocaleString("vi-VN")}</td>
        `;
        tbody.appendChild(row);
      });
      table.style.display = "table";
    }  
  </script>
</body>
</html>
